# Check that .markdownlint-rules is in sync with cypher0n3/docs-as-code-tools main.
# See dev_docs/2026-02-08_markdownlint_rules_upstream_sync_check.md.

name: Markdownlint Rules Upstream Sync

on:
  push:
    paths:
      - '.markdownlint-rules/**'
      - '.markdownlint.yml'
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  sync-check:
    name: Rules in sync with upstream main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch upstream .markdownlint-rules
        run: |
          mkdir -p tmp
          git clone --depth 1 --filter=blob:none --no-checkout \
            https://github.com/cypher0n3/docs-as-code-tools.git tmp/upstream-repo
          cd tmp/upstream-repo
          git sparse-checkout init --cone
          git sparse-checkout set .markdownlint-rules
          git checkout
          mv .markdownlint-rules ../upstream-rules
          cd ../..
          rm -rf tmp/upstream-repo

      - name: Compare with local .markdownlint-rules
        run: |
          # Compare only .js rule files; README.md may differ (e.g. short local note).
          set -e
          for f in tmp/upstream-rules/*.js; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            if [ ! -f ".markdownlint-rules/$b" ]; then
              echo "::error::Missing in repo: .markdownlint-rules/$b"
              exit 1
            fi
            if ! diff -q "tmp/upstream-rules/$b" ".markdownlint-rules/$b"; then
              echo "::error::.markdownlint-rules is out of sync with cypher0n3/docs-as-code-tools main."
              diff "tmp/upstream-rules/$b" ".markdownlint-rules/$b" || true
              exit 1
            fi
          done
          for f in .markdownlint-rules/*.js; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            if [ ! -f "tmp/upstream-rules/$b" ]; then
              echo "::error::Extra file in repo (not in upstream): .markdownlint-rules/$b"
              exit 1
            fi
          done
          echo "Rules are in sync with upstream main."
